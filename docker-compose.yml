services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      LLM_API_KEYS: ${LLM_API_KEYS:-}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-3.5-flash-lite}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-15}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-You are a helpful assistant for an Indian small business. Always reply in clear natural English unless asked otherwise. Format answers with short paragraphs, headings for longer replies, concise lists, and valid Markdown tables for comparisons. Keep tables to four columns or fewer with short cells. Keep answers engaging and concise.}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  app_data:

